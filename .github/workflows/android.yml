name: Android APK

# Runs on Android pull requests (Dependabot included; a debug build) and by hand:
# Actions tab -> "Android APK" -> Run workflow. Pick the build type and, if you want, the version.
# A release build is signed with the release key from GitHub Secrets and is only uploaded as an artifact.
# Publishing a release is the tag workflow (release.yml).
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        type: choice
        options:
          - debug
          - release
        default: debug
      version_name:
        description: "Version name, like 0.3.0 or 0.3.0-rc1 (empty: versionName from build.gradle.kts)"
        type: string
        required: false
      version_code:
        description: "Version code, a whole number above the last release (empty: versionCode from build.gradle.kts)"
        type: string
        required: false
  pull_request:
    paths:
      - android/**
      - .github/workflows/android.yml

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ inputs.build_type || 'pull-request' }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Accepts SDK licenses so Gradle can fetch the platform it needs.
      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          # setup-gradle ignores `defaults.run`; point it at the Gradle build.
          build-root-directory: android

      - name: Restore keystore
        if: inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Secret ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lumen-release.jks"
          echo "LUMEN_KEYSTORE=$RUNNER_TEMP/lumen-release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        id: build
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          LUMEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LUMEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LUMEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          package=$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          name="${VERSION_NAME:-$(sed -n 's/.*gradleProperty("versionName").getOrElse("\([^"]*\)").*/\1/p' app/build.gradle.kts)}"
          code="${VERSION_CODE:-$(sed -n 's/.*gradleProperty("versionCode").*getOrElse(\([0-9]*\)).*/\1/p' app/build.gradle.kts)}"
          [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Version name '$name' must look like 1.2.3 or 1.2.3-rc1"; exit 1; }
          [[ "$code" =~ ^[1-9][0-9]*$ ]] || { echo "Version code '$code' must be a whole number from 1"; exit 1; }

          ./gradlew "assemble${BUILD_TYPE^}" -PversionName="$name" -PversionCode="$code" --stacktrace

          apk="lumen-$name-$code-$BUILD_TYPE.apk"
          cp app/build/outputs/apk/"$BUILD_TYPE"/*.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "label=$BUILD_TYPE-$name-$code" >> "$GITHUB_OUTPUT"

          if [ "$BUILD_TYPE" = release ]; then signing="release key (GitHub Secrets)"; else signing="debug key"; fi
          {
            echo "### Lumen $BUILD_TYPE build"
            echo
            echo "| Attribute | Value |"
            echo "|---|---|"
            echo "| Package | \`$package\` |"
            echo "| Version name | \`$name\` |"
            echo "| Version code | \`$code\` |"
            echo "| Build type | $BUILD_TYPE |"
            echo "| Signed with | $signing |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Size | $(du -h "$apk" | cut -f1) |"
            echo "| SHA-256 | \`$(cut -d' ' -f1 "$apk.sha256")\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: lumen-${{ steps.build.outputs.label }}
          path: |
            android/${{ steps.build.outputs.apk }}
            android/${{ steps.build.outputs.apk }}.sha256
          if-no-files-found: error
          retention-days: 14
