name: Android APK

# Runs on Android pull requests (Dependabot included) and by hand: Actions tab -> "Android APK" -> Run workflow.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - android/**
      - .github/workflows/android.yml

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Accepts SDK licenses so Gradle can fetch the platform it needs.
      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          # setup-gradle ignores `defaults.run`; point it at the Gradle build.
          build-root-directory: android

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: lumen-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
